trigger:
  - master
  
pool:
  vmImage: 'windows-latest' 

variables:
  buildConfiguration: 'Release'
  projectName: '**/DoctorManagement.API.csproj'
  drop: '$(Build.ArtifactStagingDirectory)/drop'

stages: 
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: Build
        displayName: 'Build Job'
        steps:
         - task: Bash@3
           inputs:
             targetType: 'inline'
             script: |
              cd ../DoctorManagement.Maui
              dotnet workload restore
              cd ../DoctorManagement.Api
              dotnet publish --configuration $(buildConfiguration) --output $(drop)
                      