trigger:
  - master
  
pool:
  vmImage: 'windows-latest' 

variables:
  buildConfiguration: 'Release'
  projectName: '**/DoctorManagement.API.csproj'
  drop: '$(Build.ArtifactStagingDirectory)/drop'

stages: 
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: Build
        displayName: 'Build Job'
        steps:
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(projectName)'
              arguments: '--configuration $(buildConfiguration) --output $(drop)'
         