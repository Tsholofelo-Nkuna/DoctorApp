trigger:
  - master
  
pool:
  vmImage: 'windows-latest' 

variables:
  buildConfiguration: 'Release'
  projectName: '**/DoctorManagement.API.csproj'
  drop: '$(Build.ArtifactStagingDirectory)/drop'

stages: 
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: Build
        displayName: 'Build Job'
        steps:
         - task: Bash@3
           inputs:
             targetType: 'inline'
             script: |
              dotnet workload restore **/DoctorManagement.MAUI.csproj
         - task: DotNetCoreCLI@2
           inputs:
              command: 'publish'
              publishWebProjects: false
              arguments: '--configuration $(buildConfiguration) --output $(drop)'
              zipAfterPublish: false
              modifyOutputPath: false
              projects: $(projectName)